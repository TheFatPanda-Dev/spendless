<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Component states</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">COMPONENTS</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">Actions and feedback</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use one primary action per task. Keep field labels visible while someone types.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Components     /     09</text><text x="56" y="221" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">PRIMARY ACTION</text><rect x="56" y="249" width="210" height="46" rx="12" fill="#006447"/><text x="161.0" y="277.5" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#FFFFFF" letter-spacing="0" style="font-variant-numeric:tabular-nums">Save expense</text><text x="56" y="322" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Rest</text><rect x="289" y="245" width="218" height="54" rx="15" fill="none" stroke="#006447" stroke-width="2"/><rect x="293" y="249" width="210" height="46" rx="12" fill="#006447"/><text x="398.0" y="277.5" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#FFFFFF" letter-spacing="0" style="font-variant-numeric:tabular-nums">Save expense</text><text x="290" y="322" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Keyboard focus</text><rect x="550" y="249" width="210" height="46" rx="12" fill="#DFE5DF"/><text x="655" y="278" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58645B" letter-spacing="0" style="font-variant-numeric:tabular-nums">Save expense</text><text x="550" y="322" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Unavailable</text><rect x="815" y="249" width="210" height="46" rx="12" fill="#006447"/><text x="920.0" y="277.5" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#FFFFFF" letter-spacing="0" style="font-variant-numeric:tabular-nums">Saving…</text><text x="815" y="322" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Pending</text><path d="M57 360 L1144 360" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="406" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">FIELD VALIDATION</text><text x="56" y="455" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Amount</text><rect x="56" y="473" width="433" height="57" rx="12" fill="#FFF" stroke="#A02D33" stroke-width="2"/><text x="74" y="510" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">€0.00</text><g transform="translate(56 548) scale(0.75)"><path d="M12 3 2.5 20h19z M12 9v5 M12 17v.3" fill="none" stroke="#A02D33" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="86" y="563" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#A02D33" letter-spacing="0" style="font-variant-numeric:tabular-nums">Enter an amount greater than zero.</text><text x="598" y="406" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">SAVE CONFIRMATION</text><rect x="598" y="439" width="547" height="83" rx="15" fill="#DAF4E5"/><g transform="translate(617 463) scale(1.125)"><path d="M4 12l5 5 11-11" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="665" y="476" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Expense saved</text><text x="665" y="501" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">€4.60 · Dining</text><text x="598" y="568" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Announce the result to assistive technology. Keep the</text><text x="598" y="594" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">entered amount on screen if saving fails, and offer Retry.</text><path d="M57 636 L1144 636" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="675" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use a 2 px outline with a 2 px gap for keyboard focus. During save, disable repeat submission.</text><text x="56" y="700" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use 120 ms for press feedback and 200 ms for a sheet transition. Respect the reduced-motion setting.</text></svg>