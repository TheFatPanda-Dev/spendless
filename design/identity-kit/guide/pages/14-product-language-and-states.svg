<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Product language and states</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">PRODUCT LANGUAGE</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">Help at the point of friction</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use concrete next actions and preserve the person’s work. Apply the same copy on phone and web.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Product language     /     14</text><rect x="56" y="205" width="533" height="213" rx="16" fill="#FFFFFF" stroke="#D6DED7" stroke-width="1"/><text x="78" y="240" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">EMPTY MONTH</text><text x="78" y="288" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">No expenses in November yet.</text><text x="78" y="326" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">Add expense  ›</text><path d="M78 351 L566 351" fill="none" stroke="#DFE5DF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="383" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use a zero total only after the month has loaded.</text><rect x="610" y="205" width="533" height="213" rx="16" fill="#FFFFFF" stroke="#D6DED7" stroke-width="1"/><text x="632" y="240" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">BUDGET OVERRUN</text><text x="632" y="288" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Dining is €12.00 over budget.</text><text x="632" y="326" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">Review dining expenses  ›</text><path d="M632 351 L1120 351" fill="none" stroke="#DFE5DF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="632" y="383" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">State the category and the amount over budget.</text><rect x="56" y="445" width="533" height="213" rx="16" fill="#FFFFFF" stroke="#D6DED7" stroke-width="1"/><text x="78" y="480" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">FAILED SAVE</text><text x="78" y="528" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Your expense couldn’t be saved.</text><text x="78" y="566" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">Retry  ›</text><path d="M78 591 L566 591" fill="none" stroke="#DFE5DF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="78" y="623" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Keep the draft amount, merchant and category.</text><rect x="610" y="445" width="533" height="213" rx="16" fill="#FFFFFF" stroke="#D6DED7" stroke-width="1"/><text x="632" y="480" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">SAVED SUCCESSFULLY</text><text x="632" y="528" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Expense saved.</text><text x="632" y="566" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">View activity  ›</text><path d="M632 591 L1120 591" fill="none" stroke="#DFE5DF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="632" y="623" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Confirm the entry and refresh the month totals.</text></svg>