<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Charts and icons</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">DATA &amp; ICONS</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">Give every visual a label</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use the open ring for one part-to-whole measure. Give competing categories a shared linear scale.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Data &amp; icons     /     10</text><rect x="56" y="206" width="495" height="263" rx="16" fill="#DAF4E5"/><path d="M174 258 A77 77 0 1 1 97.000 335.000" fill="none" stroke="#A9CEB7" stroke-width="13.86" stroke-linecap="round" stroke-linejoin="round" /><path d="M174 258 A77 77 0 0 1 186.272 411.016" fill="none" stroke="#08754F" stroke-width="13.86" stroke-linecap="round" stroke-linejoin="round" /><text x="174" y="340" font-family="Roboto, Arial, sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#103B2A" letter-spacing="-1" style="font-variant-numeric:tabular-nums">63%</text><text x="174" y="361" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#36634E" letter-spacing="0" style="font-variant-numeric:tabular-nums">used</text><text x="298" y="293" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Budget used</text><text x="298" y="335" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">€1,265.40 spent</text><text x="298" y="363" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">of €2,000.00</text><text x="298" y="421" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">63% after rounding</text><text x="589" y="246" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Spending by category</text><rect x="589" y="267" width="291.94657815710445" height="24" rx="3" fill="#176343"/><rect x="882.9465781571045" y="267" width="125.6938517464833" height="24" rx="3" fill="#60AA83"/><rect x="1010.6404299035878" y="267" width="61.976608187134495" height="24" rx="3" fill="#E5A251"/><rect x="1074.6170380907222" y="267" width="34.31104788999526" height="24" rx="3" fill="#8AA9BC"/><rect x="1110.9280859807175" y="267" width="25.07191401928244" height="24" rx="3" fill="#ABB6AC"/><circle cx="597" cy="320" r="5" fill="#176343"/><text x="613" y="325" font-family="Roboto, Arial, sans-serif" font-size="16" font-wei