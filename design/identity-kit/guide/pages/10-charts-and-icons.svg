-serif" font-size="17" font-weight="500" text-anchor="end" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">€58.00</text><path d="M57 496 L1144 496" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="535" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">INTERFACE ICONS</text><rect x="60" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(74 570) scale(1.25)"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Overview</text><rect x="197" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(211 570) scale(1.25)"><path d="M4 6h16 M4 12h12 M4 18h16" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="197" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Activity</text><rect x="334" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(348 570) scale(1.25)"><path d="M11 3a9 9 0 1 0 10 10H11z M15 3.5a8 8 0 0 1 5.5 5.5H15z" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="334" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Budgets</text><rect x="471" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(485 570) scale(1.25)"><path d="M3 9h18l-2 11H5z M7 9l4-6 M17 9l-4-6 M9 12v4 M15 12v4" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="471" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Groceries</text><rect x="608" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(622 570) scale(1.25)"><path d="M3.5 8.5h12V14a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z M15.5 9h2.5a3 3 0 0 1 0 6h-2.5 M4 21h14 M7 4v1 M11 3v2" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="608" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Dining</text><rect x="745" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(759 570) scale(1.25)"><path d="M6 4h12a2 2 0 0 1 2 2v11H4V6a2 2 0 0 1 2-2z M4 11h16 M7 17v3 M17 17v3 M7 14h1 M16 14h1" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="745" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Transport</text><rect x="882" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(896 570) scale(1.25)"><path d="M12 3v12 M7 10l5 5 5-5 M4 16v4h16v-4" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="882" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Income</text><rect x="1019" y="556" width="58" height="58" rx="12" fill="#E1EDE4"/><g transform="translate(1033 570) scale(1.25)"><path d="M12 15V3 M7 8l5-5 5 5 M4 16v4h16v-4" fill="none" stroke="#006447" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1019" y="639" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Expense</text><text x="56" y="687" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Icons use a 24 × 24 grid, a 1.75 px rounded stroke and a visible label in navigation. Pair each chart with numeric text.</text><text x="56" y="711" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">When spending exceeds a budget, cap the arc at full and show the actual percentage and overage in text.</text></svg>