<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Brand foundations</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">BRAND FOUNDATIONS</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">A calmer look at spending</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">For people who want to understand everyday purchases and plan the rest of the month.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Brand foundations     /     02</text><rect x="56" y="204" width="508" height="478" rx="16" fill="#183B2A"/><text x="85" y="246" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#BCEBD0" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">PRODUCT PROMISE</text><text x="82" y="322" font-family="Roboto, Arial, sans-serif" font-size="43" font-weight="300" text-anchor="start" fill="#FAFAFA" letter-spacing="0" style="font-variant-numeric:tabular-nums">See what went out.</text><text x="82" y="380" font-family="Roboto, Arial, sans-serif" font-size="43" font-weight="300" text-anchor="start" fill="#FAFAFA" letter-spacing="0" style="font-variant-numeric:tabular-nums">Know what’s left.</text><path d="M85 429 L534 429" fill="none" stroke="#456955" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="86" y="482" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#D7E9DD" letter-spacing="0" style="font-variant-numeric:tabular-nums">Lead with the amount the person can</text><text x="86" y="516" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#D7E9DD" letter-spacing="0" style="font-variant-numeric:tabular-nums">still spend. Put the period, the budget</text><text x="86" y="550" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#D7E9DD" letter-spacing="0" style="font-variant-numeric:tabular-nums">and the transactions within reach.</text><text x="86" y="638" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#BCEBD0" letter-spacing="0" style="font-variant-numeric:tabular-nums">Personal money tracking</text><text x="610" y="242" font-family="Roboto, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Name and signature</text><text x="610" y="281" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use SpendLess in product copy. Preserve the</text><text x="610" y="309" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">capital L in the supplied wordmark. The signature</text><text x="610" y="337" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">reads “Money made simple” in the full lockup.</text><text x="610" y="414" font-family="Roboto, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Voice</text><text x="610" y="453" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use short, factual sentences. Give the amount,</text><text x="610" y="481" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">the period and a useful next action. Describe</text><text x="610" y="509" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">spending without judging the person.</text><text x="610" y="586" font-family="Roboto, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">An alert in practice</text><text x="610" y="625" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">“Dining is €12.00 over its November budget.”</text><text x="610" y="653" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Action: “Review dining expenses”.</text></svg>