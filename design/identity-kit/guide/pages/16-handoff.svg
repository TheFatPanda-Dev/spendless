<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Handoff</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">HANDOFF</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">Inside the identity kit</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Open Preview.html to compare the screens offline. Install the supplied typefaces to edit the vector layouts.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Handoff     /     16</text><path d="M56 211 L1144 211" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="240" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">identity/</text><text x="295" y="240" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Full and compact SVG lockups, symbol variants, transparent PNGs and supplied reference.</text><path d="M56 272 L1144 272" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="301" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">icons/</text><text x="295" y="301" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">App masters, PNG sizes, maskable icon, favicons and 24-unit interface icons.</text><path d="M56 333 L1144 333" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="362" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">screens/</text><text x="295" y="362" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Editable desktop overview and three phone screens, each in light and dark.</text><path d="M56 394 L1144 394" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="423" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">design-tokens/</text><text x="295" y="423" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Shared JSON, web CSS variables and native TypeScript values.</text><path d="M56 455 L1144 455" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="484" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">communications/</text><text x="295" y="484" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Editable social and link-preview layouts, PNG exports and the paper photograph.</text><path d="M56 516 L1144 516" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="545" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">typefaces/</text><text x="295" y="545" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Roboto Light, Regular and Medium, with the font licence.</text><path d="M56 577 L1144 577" fill="none" stroke="#D0D8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="606" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">guide/</text><text x="295" y="606" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">This PDF and editable SVG pages for the identity guidelines.</text><rect x="56" y="658" width="1088" height="53" rx="12" fill="#DAF4E5"/><text x="76" y="691" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">Reference screens use fictional euro amounts and an English interface. Localise currency, dates and copy for each market.</text></svg>