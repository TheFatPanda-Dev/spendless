<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Responsive layout</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">LAYOUT</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">One hierarchy at every width</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Keep the remaining budget first. Preserve the same month and category definitions across devices.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Layout     /     08</text><text x="56" y="224" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">PHONE</text><rect x="56" y="251" width="322" height="188" rx="12" fill="#E6EBE4"/><rect x="71.0" y="266" width="69.25" height="158" rx="3" fill="#B8D5C3"/><rect x="145.25" y="266" width="69.25" height="158" rx="3" fill="#B8D5C3"/><rect x="219.5" y="266" width="69.25" height="158" rx="3" fill="#B8D5C3"/><rect x="293.75" y="266" width="69.25" height="158" rx="3" fill="#B8D5C3"/><text x="56" y="480" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Below 768 px</text><text x="56" y="515" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">4 columns  /  20 px margin</text><text x="56" y="547" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use a single stack and bottom tabs.</text><text x="432" y="224" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">TABLET</text><rect x="432" y="251" width="286" height="188" rx="12" fill="#E6EBE4"/><rect x="447.0" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="479.625" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="512.25" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="544.875" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="577.5" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="610.125" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="642.75" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><rect x="675.375" y="266" width="27.625" height="158" rx="3" fill="#B8D5C3"/><text x="432" y="480" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">768–1099 px</text><text x="432" y="515" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">8 columns  /  24 px margin</text><text x="432" y="547" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use a compact rail when it fits.</text><text x="774" y="224" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">DESKTOP</text><rect x="774" y="251" width="370" height="188" rx="12" fill="#E6EBE4"/><rect x="789.0" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="817.75" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="846.5" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="875.25" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="904.0" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="932.75" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="961.5" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="990.25" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="1019.0" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="1047.75" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="1076.5" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><rect x="1105.25" y="266" width="23.75" height="158" rx="3" fill="#B8D5C3"/><text x="774" y="480" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">1100 px and up</text><text x="774" y="515" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">12 columns  /  40 px margin</text><text x="774" y="547" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use a fixed rail and two summary cards.</text><path d="M57 585 L1144 585" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="623" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">SPACING SCALE</text><text x="56" y="662" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64</text><text x="56" y="702" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use 16–24 inside cards. Leave 24–40 between sections.</text><text x="680" y="623" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">SURFACES AND INPUT</text><text x="680" y="662" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">12 px controls   /   20 px cards</text><text x="680" y="702" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use 44 × 44 minimum targets and respect device safe areas.</text></svg>