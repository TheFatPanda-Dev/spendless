<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800"><title>Typography and money formatting</title><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F6F7F2"/><text x="56" y="53" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#526158" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">TYPOGRAPHY</text><text x="53" y="120" font-family="Roboto, Arial, sans-serif" font-size="58" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-1.8" style="font-variant-numeric:tabular-nums">Roboto for words and numbers</text><text x="57" y="161" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Light, Regular and Medium carry the interface. The logo lettering is a separate, fixed piece of artwork.</text><path d="M56 743 L1144 743" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">SpendLess   /   Brand &amp; product guidelines</text><text x="1144" y="770" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Typography     /     07</text><rect x="56" y="205" width="574" height="285" rx="16" fill="#DAF4E5"/><text x="82" y="248" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">MONTHLY BALANCE</text><text x="76" y="376" font-family="Roboto, Arial, sans-serif" font-size="110" font-weight="300" text-anchor="start" fill="#151A18" letter-spacing="-5.2" style="font-variant-numeric:tabular-nums">€734.60</text><text x="84" y="446" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">Roboto Light   /   Display figures</text><text x="56" y="548" font-family="Roboto, Arial, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Money formatting</text><text x="56" y="588" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Align amount columns to the right. Use a true minus sign</text><text x="56" y="617" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">for outflows and a plus sign for inflows. Keep cents aligned.</text><text x="56" y="646" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Format dates and currency for the selected locale.</text><text x="56" y="700" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#006447" letter-spacing="0" style="font-variant-numeric:tabular-nums">en-IE  €1,265.40      ·      sl-SI  1.265,40 €</text><text x="674" y="234" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#47564D" letter-spacing="1.45" style="font-variant-numeric:tabular-nums">TYPE STYLE</text><text x="1143" y="234" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="end" fill="#526158" letter-spacing="1.1" style="font-variant-numeric:tabular-nums">SIZE / LINE · WEIGHT</text><path d="M674 254 L1144 254" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="284" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Display amount</text><text x="1144" y="284" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">64 / 68  ·  Light</text><path d="M674 309 L1144 309" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="339" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Page title</text><text x="1144" y="339" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">40 / 48  ·  Regular</text><path d="M674 364 L1144 364" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="394" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Phone title</text><text x="1144" y="394" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">32 / 38  ·  Regular</text><path d="M674 419 L1144 419" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="449" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Section title</text><text x="1144" y="449" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">22 / 28  ·  Medium</text><path d="M674 474 L1144 474" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="504" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Body</text><text x="1144" y="504" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">16 / 24  ·  Regular</text><path d="M674 529 L1144 529" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="559" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Metadata</text><text x="1144" y="559" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">14 / 20  ·  Regular</text><path d="M674 584 L1144 584" fill="none" stroke="#CCD5CD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="674" y="614" font-family="Roboto, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">Label</text><text x="1144" y="614" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">12 / 16  ·  Medium</text><text x="674" y="678" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Sizes in logical units. Display balances may scale to fit.</text><text x="674" y="702" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">Use tabular figures for amounts that update.</text></svg>