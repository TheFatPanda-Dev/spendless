t-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">RGB   250 / 250 / 250</text><text x="812" y="587" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#151A18" letter-spacing="0" style="font-variant-numeric:tabular-nums">CMYK   0 / 0 / 0 / 2</text><text x="56" y="675" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#526158" letter-spacing="0" style="font-variant-numeric:tabular-nums">sRGB values govern digital artwork. CMYK values are rounded starting mixes for print. Proof bright greens on the final stock and profile.</text></svg>