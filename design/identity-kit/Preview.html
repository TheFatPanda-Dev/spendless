<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SpendLess · Screen reference</title><link rel="icon" href="icons/app/favicon.svg"><link rel="stylesheet" href="design-tokens/spendless.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eee7;color:#151a18;font:16px/1.5 Roboto,Arial,sans-serif}header{background:#080808;color:#fafafa;padding:24px clamp(20px,5vw,80px);display:flex;align-items:center;justify-content:space-between;gap:16px}header img{width:146px}header a{color:#93efbf}main{max-width:1540px;margin:auto;padding:24px clamp(14px,4vw,60px) 60px}h1{font-weight:300;font-size:clamp(26px,4vw,42px);margin:0 0 18px;letter-spacing:-.04em}form{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 24px}label{font-size:14px;font-weight:500;display:grid;gap:4px}select{color:#151a18;background:white;min-height:44px;font:inherit;border:1px solid #718079;border-radius:10px;padding:8px 32px 8px 12px}select:focus-visible,a:focus-visible{outline:2px solid #08754f;outline-offset:3px}.frame{display:block;border:1px solid #bdc9c0;border-radius:14px;overflow:hidden;background:white;width:100%;margin-inline:auto}.frame.mobile{width:min(100%,390px);border-width:4px;border-radius:24px}.frame img{display:block;width:100%;height:auto}footer{text-align:center;color:#526158;font-size:14px;margin-top:20px}noscript{display:block;margin:12px 0}
</style></head><body><header><img src="identity/lockup-on-dark.svg" alt="SpendLess"><a href="guide/SpendLess-Brand-Guide.pdf">Brand guide</a></header><main><h1>Screen reference</h1><form><label>Screen<select id="screen"><option value="web-overview">Web · Overview</option><option value="phone-overview">Phone · Overview</option><option value="phone-activity">Phone · Activity</option><option value="phone-entry">Phone · Add transaction</option></select></label><label>Appearance<select id="appearance"><option value="light">Light</option><option value="dark">Dark</option></select></label></form><noscript>Open the screens folder to view the other references.</noscript><div class="frame" id="frame"><img id="art" src="screens/web-overview-light.png" alt="SpendLess desktop overview in light mode"></div><footer><a id="source" href="screens/web-overview-light.svg">Open editable SVG</a></footer></main><script>
const screenSelect = document.getElementById('screen');
const appearance = document.getElementById('appearance');
const art = document.getElementById('art');
const frame = document.getElementById('frame');
const source = document.getElementById('source');
function updateScreen() {
  const name = screenSelect.value;
  const theme = appearance.value;
  const stem = 'screens/' + name + '-' + theme;
  frame.classList.toggle('mobile', name.startsWith('phone-'));
  art.src = stem + '.png';
  art.alt = 'SpendLess ' + screenSelect.selectedOptions[0].text + ', ' + theme + ' mode';
  source.href = stem + '.svg';
}
screenSelect.addEventListener('change', updateScreen);
appearance.addEventListener('change', updateScreen);
</script></body></html>
